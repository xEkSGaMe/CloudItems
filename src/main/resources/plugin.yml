name: CloudItems
version: '${project.version}'
main: com.yourname.clouditems.CloudItems
api-version: '1.21'
authors: [yourname]
description: CloudItems plugin

commands:
  runes:
    description: Manage CloudItems runes
    usage: /runes <give|reload|list|info>
    permission: runes.admin

permissions:
  runes.admin:
    description: Admin access to /runes
    default: op
  runes.use:
    description: Allows activating runes
    default: true
